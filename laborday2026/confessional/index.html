<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confessional — Labor Day at the Lake</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../assets/labor-day-title.png" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    main.confessional {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
      gap: 2rem;
      text-align: center;
    }

    .confessional h1 {
      font-family: var(--serif);
      font-weight: normal;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      letter-spacing: 0.32em;
      margin: 0;
      color: var(--ink);
    }

    .confessional .ornament {
      color: var(--ink-soft);
      font-size: 1.4rem;
    }

    .confessional .prompt {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-soft);
      font-size: 1.05rem;
      max-width: 28rem;
      line-height: 1.55;
    }

    .gate-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      width: min(22rem, 100%);
    }

    .gate-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--ink-faint);
      font-family: var(--serif);
      font-size: 1.4rem;
      color: var(--ink);
      text-align: center;
      letter-spacing: 0.18em;
      padding: 0.6rem 0.2rem;
      outline: none;
      transition: border-color 200ms ease;
    }

    .gate-input:focus {
      border-bottom-color: var(--ink);
    }

    .gate-input::placeholder {
      color: var(--ink-faint);
      letter-spacing: 0.18em;
      font-style: italic;
    }

    .gate-submit {
      background: transparent;
      border: 1px solid var(--ink);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 0.95rem;
      letter-spacing: 0.24em;
      padding: 0.55rem 1.6rem;
      cursor: pointer;
      transition: background 200ms ease, color 200ms ease;
    }

    .gate-submit:hover {
      background: var(--ink);
      color: var(--paper);
    }

    .gate-error {
      font-style: italic;
      color: var(--ink-soft);
      min-height: 1.4em;
      font-size: 0.95rem;
    }

    .gate-error.is-wrong {
      color: #8a3a23;
    }

    .video-wrap {
      width: min(960px, 100%);
      aspect-ratio: 16 / 9;
      background: rgba(20, 30, 18, 0.05);
      border: 1px solid var(--rule);
    }

    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-caption {
      font-style: italic;
      color: var(--ink-soft);
      max-width: 32rem;
    }

    .back-link {
      font-family: var(--serif);
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      color: var(--ink-soft);
      border-bottom: 1px solid var(--ink-faint);
      padding-bottom: 2px;
      transition: color 200ms ease, border-color 200ms ease;
    }

    .back-link:hover {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }

    [hidden] { display: none !important; }

    @keyframes confessional-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .shake { animation: confessional-shake 320ms ease; }
  </style>
</head>
<body>

  <main class="confessional">
    <h1>CONFESSIONAL</h1>
    <span class="ornament">✦</span>

    <!-- GATE -->
    <section id="gate">
      <p class="prompt">
        Speak the word and the curtain parts.
      </p>
      <form class="gate-form" id="gateForm" autocomplete="off">
        <input
          type="password"
          class="gate-input"
          id="gateInput"
          placeholder="enter the secret"
          aria-label="Secret code"
          autocapitalize="none"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit" class="gate-submit">ENTER</button>
        <p class="gate-error" id="gateError" aria-live="polite"></p>
      </form>
    </section>

    <!-- REVEAL -->
    <section id="reveal" hidden>
      <div class="video-wrap">
        <video
          id="videoEl"
          controls
          playsinline
          preload="metadata"
        ></video>
      </div>
      <p class="video-caption">
        Some things are best whispered. Welcome to the record.
      </p>
    </section>

    <a class="back-link" href="../#home">← back to the lake</a>
  </main>

  <script>
    // ============================================================
    //  SWAP THESE TWO VALUES, then save and push.
    //
    //  SECRET    — the code visitors must type. Case-insensitive.
    //  VIDEO_URL — the public URL of the video file on R2
    //              (e.g. https://video.griffinmiller.com/confessional.mp4).
    //
    //  Note: this is a JOKE gate. Both values are visible in the
    //  page source. Don't treat it as real security.
    // ============================================================
    const SECRET    = "BUNK12";
    const VIDEO_URL = "https://pub-1ed54b76dc0a40ed93d3be5e74eed058.r2.dev/confessional.mp4";

    const form = document.getElementById("gateForm");
    const input = document.getElementById("gateInput");
    const error = document.getElementById("gateError");
    const gate = document.getElementById("gate");
    const reveal = document.getElementById("reveal");
    const videoEl = document.getElementById("videoEl");

    const wrongMessages = [
      "Not quite. Try again.",
      "The walls remain.",
      "No — softer than that.",
      "Closer, but no.",
    ];

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const guess = input.value.trim().toLowerCase();
      const secret = SECRET.trim().toLowerCase();

      if (guess === secret) {
        // Set src only at unlock time so the URL isn't pre-baked into
        // the DOM before the secret is entered. (Joke-level only — the
        // URL is still in the JS source. This is for vibes.)
        videoEl.src = VIDEO_URL;
        gate.hidden = true;
        reveal.hidden = false;
        videoEl.play().catch(() => {/* autoplay can be blocked; that's fine */});
      } else {
        const msg = wrongMessages[Math.floor(Math.random() * wrongMessages.length)];
        error.textContent = msg;
        error.classList.add("is-wrong");
        input.classList.add("shake");
        input.addEventListener("animationend", () => input.classList.remove("shake"), { once: true });
        input.select();
      }
    });

    input.addEventListener("input", () => {
      if (error.textContent) {
        error.textContent = "";
        error.classList.remove("is-wrong");
      }
    });

    // Autofocus on desktop, but not on mobile (keyboard popping is jarring)
    if (window.matchMedia("(min-width: 768px)").matches) {
      input.focus();
    }
  </script>

</body>
</html>
